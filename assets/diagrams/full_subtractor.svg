<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Full subtractor = two half subtractors + OR</title>
<desc>Structural full subtractor (module full_subtractor): hs0 computes a-b, hs1 subtracts bin, OR combines the borrows.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker></defs>
<rect width="900" height="320" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1b2a3a">Full subtractor = two half subtractors + OR</text>
<rect x="140.0" y="70.0" width="150.0" height="90.0" rx="8" fill="#eaf2fa" stroke="#1f4e79" stroke-width="1.6"/>
<text x="215.0" y="111.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">half_subtractor</text>
<text x="215.0" y="128.1" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">half0</text>
<rect x="390.0" y="120.0" width="150.0" height="90.0" rx="8" fill="#eaf2fa" stroke="#1f4e79" stroke-width="1.6"/>
<text x="465.0" y="161.1" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">half_subtractor</text>
<text x="465.0" y="178.1" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">half1</text>
<text x="70.0" y="99.0" font-size="14" text-anchor="end" font-weight="bold" fill="#1b2a3a">a</text>
<line x1="76.0" y1="95.0" x2="140.0" y2="95.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="70.0" y="139.0" font-size="14" text-anchor="end" font-weight="bold" fill="#1b2a3a">b</text>
<line x1="76.0" y1="135.0" x2="140.0" y2="135.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="70.0" y="194.0" font-size="14" text-anchor="end" font-weight="bold" fill="#1b2a3a">bin</text>
<polyline points="76.0,190.0 390.0,190.0" fill="none" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="290.0" y1="100.0" x2="390.0" y2="145.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="340.0" y="116.5" font-size="11" text-anchor="middle" font-weight="normal" fill="#444">d1</text>
<polyline points="290.0,135.0 330.0,135.0 330.0,250.0 600.0,250.0" fill="none" stroke="#1b2a3a" stroke-width="1.6"/>
<text x="300.0" y="128.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">b1</text>
<path d="M600,215 Q614,235 600,255 Q634,255 648,235 Q634,215 600,215 Z" fill="#ffffff" stroke="#1b2a3a" stroke-width="1.8"/>
<line x1="560.0" y1="228.0" x2="605.0" y2="226.0" stroke="#1b2a3a" stroke-width="1.6"/>
<polyline points="540.0,185.0 560.0,185.0 560.0,226.0 605.0,226.0" fill="none" stroke="#1b2a3a" stroke-width="1.6"/>
<polyline points="600.0,250.0 605.0,246.0" fill="none" stroke="#1b2a3a" stroke-width="1.6"/>
<text x="560.0" y="178.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">b2</text>
<line x1="648.0" y1="235.0" x2="718.0" y2="235.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="724.0" y="240.0" font-size="14" text-anchor="start" font-weight="bold" fill="#d55e00">bout</text>
<line x1="540.0" y1="145.0" x2="760.0" y2="145.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="766.0" y="150.0" font-size="14" text-anchor="start" font-weight="bold" fill="#d55e00">diff</text>
<text x="20.0" y="276.0" font-size="12" text-anchor="start" font-weight="normal" fill="#555">diff = a ⊕ b ⊕ bin</text>
<text x="20.0" y="294.0" font-size="12" text-anchor="start" font-weight="normal" fill="#555">bout = a'·b + (a ⊕ b)'·bin</text>
<text x="20.0" y="312.0" font-size="12" text-anchor="start" font-weight="normal" fill="#555">source: rtl/arithmetic/full_subtractor.v</text>
</svg>
