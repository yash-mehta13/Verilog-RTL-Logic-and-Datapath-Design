<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Repository overview and RTL verification workflow</title>
<desc>Four lab tasks feed one shared RTL library; every module is checked by self-checking testbenches run by scripts/run_tests.py.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker></defs>
<rect width="1100" height="520" fill="#ffffff"/>
<text x="30.0" y="34.0" font-size="20" text-anchor="start" font-weight="bold" fill="#1b2a3a">Digital Systems Design Lab - repository overview</text>
<rect x="30.0" y="60.0" width="230.0" height="74.0" rx="8" fill="#eaf2fa" stroke="#1f4e79" stroke-width="1.6"/>
<text x="145.0" y="84.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Task I</text>
<text x="145.0" y="101.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">adders, subtractors,</text>
<text x="145.0" y="118.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">multipliers, NAND/NOR</text>
<line x1="145.0" y1="134.0" x2="145.0" y2="170.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="290.0" y="60.0" width="230.0" height="74.0" rx="8" fill="#e7f5ec" stroke="#1f4e79" stroke-width="1.6"/>
<text x="405.0" y="84.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Task II</text>
<text x="405.0" y="101.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">Boolean F / F',</text>
<text x="405.0" y="118.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">SOP/POS, K-map, gates</text>
<line x1="405.0" y1="134.0" x2="405.0" y2="170.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="550.0" y="60.0" width="230.0" height="74.0" rx="8" fill="#fff1e0" stroke="#1f4e79" stroke-width="1.6"/>
<text x="665.0" y="84.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Task III</text>
<text x="665.0" y="101.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">MUX, DEMUX,</text>
<text x="665.0" y="118.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">decoders, encoders</text>
<line x1="665.0" y1="134.0" x2="665.0" y2="170.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="810.0" y="60.0" width="230.0" height="74.0" rx="8" fill="#f3ebf7" stroke="#1f4e79" stroke-width="1.6"/>
<text x="925.0" y="84.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Task IV</text>
<text x="925.0" y="101.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">ALU 1/4/8-bit, CLA,</text>
<text x="925.0" y="118.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">Booth, comparator, FPGA</text>
<line x1="925.0" y1="134.0" x2="925.0" y2="170.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="30.0" y="170.0" width="1010.0" height="64.0" rx="8" fill="#f2f2f2" stroke="#1f4e79" stroke-width="1.6"/>
<text x="535.0" y="198.1" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">rtl/  - synthesizable Verilog-2001 library (one authoritative copy)</text>
<text x="535.0" y="215.1" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">arithmetic | multipliers | mux | decoder | encoder | demux | datapath | alu | fpga</text>
