<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" font-family="Helvetica, Arial, sans-serif" role="img">
<title>4-bit carry-lookahead adder</title>
<desc>cla_adder4: generate/propagate per bit, a lookahead unit computing every carry from g, p and cin, and sum XORs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker></defs>
<rect width="1000" height="430" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1b2a3a">4-bit carry-lookahead adder  (module cla_adder4)</text>
<rect x="40.0" y="60.0" width="260.0" height="90.0" rx="8" fill="#eaf2fa" stroke="#1f4e79" stroke-width="1.6"/>
<text x="170.0" y="92.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">P/G generation (per bit)</text>
<text x="170.0" y="109.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">g[i] = a[i] · b[i]</text>
<text x="170.0" y="126.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">p[i] = a[i] ⊕ b[i]</text>
<rect x="370.0" y="60.0" width="300.0" height="90.0" rx="8" fill="#fff1e0" stroke="#1f4e79" stroke-width="1.6"/>
<text x="520.0" y="92.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Carry-lookahead unit</text>
<text x="520.0" y="109.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">c1..c3, cout from g, p, cin</text>
<text x="520.0" y="126.5" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">(two gate levels after p/g)</text>
<rect x="740.0" y="60.0" width="220.0" height="90.0" rx="8" fill="#e7f5ec" stroke="#1f4e79" stroke-width="1.6"/>
<text x="850.0" y="101.0" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Sum XORs</text>
<text x="850.0" y="118.0" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">sum[i] = p[i] ⊕ c[i]</text>
<text x="170.0" y="175.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b2a3a">a[3:0], b[3:0]</text>
<line x1="170.0" y1="165.0" x2="170.0" y2="150.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="300.0" y1="105.0" x2="370.0" y2="105.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="335.0" y="99.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#444">g, p</text>
<line x1="670.0" y1="105.0" x2="740.0" y2="105.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="705.0" y="99.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#444">c[3:0]</text>
<polyline points="250.0,150.0 250.0,200.0 850.0,200.0 850.0,150.0" fill="none" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="550.0" y="215.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#444">p[3:0]</text>
<text x="520.0" y="45.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b2a3a">cin</text>
<line x1="520.0" y1="48.0" x2="520.0" y2="60.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="960.0" y1="105.0" x2="990.0" y2="105.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="985.0" y="95.0" font-size="12" text-anchor="end" font-weight="bold" fill="#d55e00">sum</text>
<line x1="520.0" y1="150.0" x2="520.0" y2="185.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="530.0" y="182.0" font-size="12" text-anchor="start" font-weight="bold" fill="#d55e00">cout, group_p, group_g</text>
<text x="40.0" y="260.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1b2a3a" font-family="Menlo, Consolas, monospace">c1 = g0 + p0·c0</text>
<text x="40.0" y="286.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1b2a3a" font-family="Menlo, Consolas, monospace">c2 = g1 + p1·g0 + p1·p0·c0</text>
<text x="40.0" y="312.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1b2a3a" font-family="Menlo, Consolas, monospace">c3 = g2 + p2·g1 + p2·p1·g0 + p2·p1·p0·c0</text>
<text x="40.0" y="338.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1b2a3a" font-family="Menlo, Consolas, monospace">c4 = g3 + p3·g2 + p3·p2·g1 + p3·p2·p1·g0 + p3·p2·p1·p0·c0   (= cout)</text>
<text x="40.0" y="364.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1b2a3a" font-family="Menlo, Consolas, monospace">group_g = g3 + p3·g2 + p3·p2·g1 + p3·p2·p1·g0      group_p = p3·p2·p1·p0</text>
<text x="40.0" y="390.0" font-size="14" text-anchor="start" font-weight="normal" fill="#1b2a3a" font-family="Menlo, Consolas, monospace">c0 = cin;  every carry is a two-level AND-OR of g, p, cin - no carry waits for the previous carry</text>
</svg>
