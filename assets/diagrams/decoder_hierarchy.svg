<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" width="1100" height="520" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Hierarchical decoders</title>
<desc>decoder2to4 = 1:2 steering + two 1:2; decoder3to8 = 1:2 steering + two 2:4; decoder4to16 = 1:2 steering + two 3:8. Active-high enable and outputs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker></defs>
<rect width="1100" height="520" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1b2a3a">Decoder hierarchy: 4:16 &lt;- 3:8 &lt;- 2:4 &lt;- 1:2   (active-high en and y)</text>
<rect x="40.0" y="220.0" width="140.0" height="80.0" rx="8" fill="#f3ebf7" stroke="#1f4e79" stroke-width="1.6"/>
<text x="110.0" y="256.1" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">decoder1to2</text>
<text x="110.0" y="273.1" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">steering on a[3]</text>
<text x="110.0" y="330.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b2a3a">en</text>
<line x1="110.0" y1="320.0" x2="110.0" y2="300.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="30.0" y="250.0" font-size="12" text-anchor="end" font-weight="bold" fill="#1b2a3a">a[3]</text>
<line x1="34.0" y1="246.0" x2="40.0" y2="246.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<rect x="300.0" y="80.0" width="170.0" height="100.0" rx="8" fill="#fff1e0" stroke="#1f4e79" stroke-width="1.6"/>
<text x="385.0" y="117.5" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">decoder3to8</text>
<text x="385.0" y="134.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">en = e[0]</text>
<text x="385.0" y="151.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">y[7:0]</text>
<polyline points="180.0,250.0 240.0,250.0 240.0,130.0 300.0,130.0" fill="none" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="250.0" y="124.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">e[0]</text>
<line x1="470.0" y1="130.0" x2="520.0" y2="130.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="526.0" y="135.0" font-size="13" text-anchor="start" font-weight="bold" fill="#d55e00">y[7:0]</text>
<rect x="300.0" y="340.0" width="170.0" height="100.0" rx="8" fill="#fff1e0" stroke="#1f4e79" stroke-width="1.6"/>
<text x="385.0" y="377.6" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">decoder3to8</text>
<text x="385.0" y="394.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">en = e[1]</text>
<text x="385.0" y="411.6" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">y[15:8]</text>
<polyline points="180.0,270.0 240.0,270.0 240.0,390.0 300.0,390.0" fill="none" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="250.0" y="384.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">e[1]</text>
<line x1="470.0" y1="390.0" x2="520.0" y2="390.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="526.0" y="395.0" font-size="13" text-anchor="start" font-weight="bold" fill="#d55e00">y[15:8]</text>
<text x="300.0" y="210.0" font-size="12" text-anchor="start" font-weight="normal" fill="#444">a[2:0] to both 3:8 blocks</text>
<rect x="640" y="60" width="440" height="420" rx="12" fill="none" stroke="#d55e00" stroke-dasharray="6 4"/>
<text x="660.0" y="84.0" font-size="14" text-anchor="start" font-weight="bold" fill="#d55e00">inside decoder3to8</text>
<rect x="660.0" y="230.0" width="110.0" height="70.0" rx="8" fill="#f3ebf7" stroke="#1f4e79" stroke-width="1.6"/>
<text x="715.0" y="261.4" font-size="12" text-anchor="middle" font-weight="bold" fill="#1b2a3a">decoder1to2</text>
<text x="715.0" y="276.4" font-size="11" text-anchor="middle" font-weight="normal" fill="#1b2a3a">on a[2]</text>
<rect x="830.0" y="110.0" width="110.0" height="80.0" rx="8" fill="#e7f5ec" stroke="#1f4e79" stroke-width="1.6"/>
<text x="885.0" y="146.3" font-size="12" text-anchor="middle" font-weight="bold" fill="#1b2a3a">decoder2to4</text>
<text x="885.0" y="161.3" font-size="11" text-anchor="middle" font-weight="normal" fill="#1b2a3a">en=e[0]</text>
<polyline points="770.0,255.0 800.0,255.0 800.0,150.0 830.0,150.0" fill="none" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="940.0" y1="150.0" x2="970.0" y2="150.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="975.0" y="155.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1b2a3a">y[3:0]</text>
<rect x="830.0" y="330.0" width="110.0" height="80.0" rx="8" fill="#e7f5ec" stroke="#1f4e79" stroke-width="1.6"/>
<text x="885.0" y="366.4" font-size="12" text-anchor="middle" font-weight="bold" fill="#1b2a3a">decoder2to4</text>
<text x="885.0" y="381.4" font-size="11" text-anchor="middle" font-weight="normal" fill="#1b2a3a">en=e[1]</text>
<polyline points="770.0,275.0 800.0,275.0 800.0,370.0 830.0,370.0" fill="none" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="940.0" y1="370.0" x2="970.0" y2="370.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="975.0" y="375.0" font-size="12" text-anchor="start" font-weight="bold" fill="#1b2a3a">y[7:4]</text>
<text x="830.0" y="222.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">each 2:4 = 1:2 on a[1]</text>
<text x="830.0" y="238.0" font-size="11" text-anchor="start" font-weight="normal" fill="#444">+ two 1:2 on a[0]</text>
<text x="20.0" y="505.0" font-size="12" text-anchor="start" font-weight="normal" fill="#555">Active-low wrappers (decoder2to4_n, decoder3to8_n, decoder4to16_n): en_n = 0 enables; the selected y_n output is 0.</text>
</svg>
