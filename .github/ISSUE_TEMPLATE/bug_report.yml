name: Bug report
description: Wrong result, failing testbench, or documentation error
labels: [bug]
body:
  - type: input
    id: module
    attributes:
      label: Module or document
      placeholder: e.g. rtl/alu/alu.v or docs/task03-mux-decoder-encoder.md
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Commands run and output
      description: Include `python scripts/run_tests.py --check-tools` output and the failing log.
      render: shell
    validations:
      required: true
