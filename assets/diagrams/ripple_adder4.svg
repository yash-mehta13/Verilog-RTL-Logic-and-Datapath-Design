<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 300" width="980" height="300" font-family="Helvetica, Arial, sans-serif" role="img">
<title>4-bit ripple-carry adder</title>
<desc>Four full_adder stages; carry c[i+1] of stage i feeds stage i+1 (module ripple_adder4).</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker></defs>
<rect width="980" height="300" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1b2a3a">4-bit ripple-carry adder  (module ripple_adder4)</text>
<rect x="760.0" y="110.0" width="140.0" height="80.0" rx="8" fill="#eaf2fa" stroke="#1f4e79" stroke-width="1.6"/>
<text x="830.0" y="146.1" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">full_adder</text>
<text x="830.0" y="163.1" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">stage[0]</text>
<text x="800.0" y="70.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b2a3a">a[0]</text>
<text x="860.0" y="70.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b2a3a">b[0]</text>
<line x1="800.0" y1="76.0" x2="800.0" y2="110.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="860.0" y1="76.0" x2="860.0" y2="110.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="830.0" y1="190.0" x2="830.0" y2="240.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="830.0" y="258.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#d55e00">sum[0]</text>
<rect x="540.0" y="110.0" width="140.0" height="80.0" rx="8" fill="#eaf2fa" stroke="#1f4e79" stroke-width="1.6"/>
<text x="610.0" y="146.1" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">full_adder</text>
<text x="610.0" y="163.1" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">stage[1]</text>
<text x="580.0" y="70.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b2a3a">a[1]</text>
<text x="640.0" y="70.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b2a3a">b[1]</text>
<line x1="580.0" y1="76.0" x2="580.0" y2="110.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="640.0" y1="76.0" x2="640.0" y2="110.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="610.0" y1="190.0" x2="610.0" y2="240.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="610.0" y="258.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#d55e00">sum[1]</text>
<rect x="320.0" y="110.0" width="140.0" height="80.0" rx="8" fill="#eaf2fa" stroke="#1f4e79" stroke-width="1.6"/>
<text x="390.0" y="146.1" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">full_adder</text>
<text x="390.0" y="163.1" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">stage[2]</text>
<text x="360.0" y="70.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b2a3a">a[2]</text>
<text x="420.0" y="70.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b2a3a">b[2]</text>
<line x1="360.0" y1="76.0" x2="360.0" y2="110.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="420.0" y1="76.0" x2="420.0" y2="110.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="390.0" y1="190.0" x2="390.0" y2="240.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="390.0" y="258.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#d55e00">sum[2]</text>
<rect x="100.0" y="110.0" width="140.0" height="80.0" rx="8" fill="#eaf2fa" stroke="#1f4e79" stroke-width="1.6"/>
<text x="170.0" y="146.1" font-size="14" text-anchor="middle" font-weight="bold" fill="#1b2a3a">full_adder</text>
<text x="170.0" y="163.1" font-size="13" text-anchor="middle" font-weight="normal" fill="#1b2a3a">stage[3]</text>
<text x="140.0" y="70.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b2a3a">a[3]</text>
<text x="200.0" y="70.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b2a3a">b[3]</text>
<line x1="140.0" y1="76.0" x2="140.0" y2="110.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="200.0" y1="76.0" x2="200.0" y2="110.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="170.0" y1="190.0" x2="170.0" y2="240.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="170.0" y="258.0" font-size="13" text-anchor="middle" font-weight="bold" fill="#d55e00">sum[3]</text>
<text x="960.0" y="154.0" font-size="13" text-anchor="end" font-weight="bold" fill="#1b2a3a">cin = c[0]</text>
<line x1="960.0" y1="160.0" x2="900.0" y2="160.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<line x1="760.0" y1="150.0" x2="680.0" y2="150.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="720.0" y="144.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#444">c[1]</text>
<line x1="540.0" y1="150.0" x2="460.0" y2="150.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="500.0" y="144.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#444">c[2]</text>
<line x1="320.0" y1="150.0" x2="240.0" y2="150.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="280.0" y="144.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#444">c[3]</text>
<line x1="100.0" y1="150.0" x2="40.0" y2="150.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="30.0" y="140.0" font-size="13" text-anchor="start" font-weight="bold" fill="#d55e00">cout</text>
<text x="30.0" y="160.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1b2a3a">= c[4]</text>
<text x="20.0" y="288.0" font-size="12" text-anchor="start" font-weight="normal" fill="#555">Worst-case delay grows linearly with width: the carry may travel through every stage (e.g. 1111 + 0000 + cin=1).</text>
</svg>
