<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Helvetica, Arial, sans-serif" role="img">
<title>Booth multiplier datapath</title>
<desc>Registers, adder/subtractor, shifter and control of booth_mult.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1b2a3a"/></marker></defs>
<rect width="1000" height="520" fill="#ffffff"/>
<text x="20.0" y="30.0" font-size="18" text-anchor="start" font-weight="bold" fill="#1b2a3a">Booth multiplier datapath (module booth_mult, parameter N)</text>
<rect x="40.0" y="70.0" width="200.0" height="60.0" rx="8" fill="#eaf2fa" stroke="#1f4e79" stroke-width="1.6"/>
<text x="140.0" y="96.3" font-size="12" text-anchor="middle" font-weight="bold" fill="#1b2a3a">M register</text>
<text x="140.0" y="111.3" font-size="11" text-anchor="middle" font-weight="normal" fill="#1b2a3a">{mcand[N-1], mcand}  N+1 bits</text>
<rect x="330.0" y="180.0" width="230.0" height="80.0" rx="8" fill="#fff1e0" stroke="#1f4e79" stroke-width="1.6"/>
<text x="445.0" y="208.2" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Adder / subtractor</text>
<text x="445.0" y="224.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1b2a3a">A+M, A-M or A</text>
<text x="445.0" y="240.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1b2a3a">(selected by Q[0], Q-1)</text>
<rect x="330.0" y="330.0" width="160.0" height="60.0" rx="8" fill="#e7f5ec" stroke="#1f4e79" stroke-width="1.6"/>
<text x="410.0" y="356.2" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b2a3a">A register</text>
<text x="410.0" y="372.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1b2a3a">N+1 bits</text>
<rect x="510.0" y="330.0" width="160.0" height="60.0" rx="8" fill="#e7f5ec" stroke="#1f4e79" stroke-width="1.6"/>
<text x="590.0" y="356.2" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Q register</text>
<text x="590.0" y="372.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1b2a3a">N bits (multiplier)</text>
<rect x="690.0" y="330.0" width="80.0" height="60.0" rx="8" fill="#e7f5ec" stroke="#1f4e79" stroke-width="1.6"/>
<text x="730.0" y="356.2" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Q-1</text>
<text x="730.0" y="372.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1b2a3a">1 bit</text>
<rect x="640.0" y="180.0" width="180.0" height="80.0" rx="8" fill="#f3ebf7" stroke="#1f4e79" stroke-width="1.6"/>
<text x="730.0" y="216.2" font-size="13" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Arithmetic</text>
<text x="730.0" y="232.2" font-size="12" text-anchor="middle" font-weight="normal" fill="#1b2a3a">shift right by 1</text>
<rect x="840.0" y="70.0" width="140.0" height="110.0" rx="8" fill="#f2f2f2" stroke="#1f4e79" stroke-width="1.6"/>
<text x="910.0" y="106.3" font-size="12" text-anchor="middle" font-weight="bold" fill="#1b2a3a">Control</text>
<text x="910.0" y="121.3" font-size="11" text-anchor="middle" font-weight="normal" fill="#1b2a3a">count (8 bits)</text>
<text x="910.0" y="136.3" font-size="11" text-anchor="middle" font-weight="normal" fill="#1b2a3a">busy, done</text>
<text x="910.0" y="151.3" font-size="11" text-anchor="middle" font-weight="normal" fill="#1b2a3a">start, rst_n</text>
<polyline points="240.0,100.0 445.0,100.0 445.0,180.0" fill="none" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="410.0,330.0 410.0,260.0" fill="none" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="380.0" y="300.0" font-size="12" text-anchor="start" font-weight="normal" fill="#1b2a3a">A</text>
<line x1="560.0" y1="220.0" x2="640.0" y2="220.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="600.0" y="214.0" font-size="11" text-anchor="middle" font-weight="normal" fill="#444">a_op</text>
<polyline points="730.0,260.0 730.0,300.0 410.0,300.0 410.0,330.0" fill="none" stroke="#1b2a3a" stroke-width="1.6"/>
<polyline points="730.0,300.0 590.0,300.0 590.0,330.0" fill="none" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="730.0,300.0 730.0,330.0" fill="none" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<polyline points="600.0,390.0 600.0,420.0 300.0,420.0 300.0,240.0 330.0,240.0" fill="none" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="310.0" y="415.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1b2a3a">Q[0]</text>
<polyline points="730.0,390.0 730.0,440.0 280.0,440.0 280.0,250.0 330.0,250.0" fill="none" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="700.0" y="455.0" font-size="11" text-anchor="start" font-weight="normal" fill="#1b2a3a">Q-1</text>
<rect x="790.0" y="330.0" width="190.0" height="60.0" rx="8" fill="#fff1e0" stroke="#1f4e79" stroke-width="1.6"/>
<text x="885.0" y="348.9" font-size="12" text-anchor="middle" font-weight="bold" fill="#1b2a3a">product register (2N bits)</text>
<text x="885.0" y="363.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#1b2a3a">loaded with {A[N-1:0], Q}</text>
<text x="885.0" y="378.9" font-size="11" text-anchor="middle" font-weight="normal" fill="#1b2a3a">on the last step</text>
<line x1="770.0" y1="360.0" x2="790.0" y2="360.0" stroke="#1b2a3a" stroke-width="1.6" marker-end="url(#arrow)"/>
<text x="20.0" y="160.0" font-size="12" text-anchor="start" font-weight="normal" fill="#555">multiplicand, multiplier: sampled when start=1 and busy=0</text>
<text x="20.0" y="500.0" font-size="12" text-anchor="start" font-weight="normal" fill="#555">Control: count starts at N, one step per clock; done pulses for one cycle when count reaches 0.</text>
</svg>
